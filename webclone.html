<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Basic HTML Example</title>
</head>
<body>
  <h3>ADDED IMAGE VIA LOCAL STORAGE</h3>
  <img src="apple.jpg" alt="Apple Image" width="50" />

  <h3>ADDED IMAGE VIA CDN</h3>
  <img src="https://upload.wikimedia.org/wikipedia/commons/1/15/Red_Apple.jpg" alt="Apple via CDN" width="50" />

  <h3>ADDED VIDEO VIA CDN</h3>
  <video width="320" height="240" controls>
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4" />
  </video>

  <h3>CREATE A BASIC FORM</h3>
  <form>
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" placeholder="ENTER USERNAME" /><br /><br />

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="ENTER PASSWORD" /><br /><br />

    <input type="submit" value="Submit" />
  </form>

  <h3>HTML ENTRIES</h3>
  <ul>
    <li>- copyright: &copy;</li>
    <li>- trademark: &trade;</li>
    <li>- ampersand: &amp;</li>
  </ul>
</body>
</html>
