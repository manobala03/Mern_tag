<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todolist</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      color: white;
      background-image: url('https://ik.imagekit.io/4z8covdo9/Full%20stack/todolistbg.png');
     background-repeat: no-repeat;
      background-position: center;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      padding: 20px;
      width: 300px;
      border-radius: 8px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    h3 {
      margin: 15px 0 5px;
    }

    p {
      font-size: 14px;
      line-height: 1.5;
    }

    .btn {
      background-color: orange;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn:hover {
      background-color: darkorange;
    }

    .link {
      margin-top: 10px;
      display: block;
      color: white;
      text-decoration: underline;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Todolist</h1>
    <p>Each day I will accomplish one thing on my todo list.</p>

    <h3>Read a Book</h3>
    <p>I don’t think that the human race will survive the next thousand years, unless we spread into space. There are too many accidents that can befall life on a single planet. But I’m an optimist…</p>

    <button class="btn">Start</button>
    <a href="#" class="link">Don't skip introduction</a>
  </div>
</body>
</html>
