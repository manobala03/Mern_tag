<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todolist</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background: url("https://ik.imagekit.io/4z8covdo9/Full%20stack/todolistbg.png?updatedAt=1700761069523") no-repeat center center;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      
      padding: 20px;
      border-radius: 10px;
      max-width: 350px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      font-weight: bold;
    }

    p {
      font-size: 14px;
      line-height: 1.5;
      margin: 10px 0;
    }

    h3 {
      margin-top: 15px;
      margin-bottom: 8px;
      font-size: 18px;
    }

    .btn {
      display: inline-block;
      margin: 15px 0;
      padding: 10px 20px;
      background-color: orange;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .link {
      font-size: 12px;
      color: white;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Todolist</h1>
    <p>Each day I will accomplish one thing on my todo list.</p>

    <h3>Read a Book</h3>
    <p>
      I don't think that the human race will survive the next thousand years, unless we spread into space. 
      There are too many accidents that can befall life on a single planet. But I'm an optimist...
    </p>

    <button class="btn">Start</button>
    <div class="link">Don't skip introduction</div>
  </div>
</body>
</html>
